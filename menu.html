<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>ZAETHR Menu</title>

<style>

body{

background:#121212;
color:white;
font-family:Arial;
text-align:center;
padding:20px;

}

h1{
font-size:38px;
margin-bottom:20px;
}

.product{

background:#1e1e1e;
padding:15px;
margin:10px;
border-radius:10px;
cursor:pointer;

}

.product:hover{
background:#333;
}

.cart{

margin-top:30px;

}

button{

padding:12px 25px;
border:none;
border-radius:10px;
background:#3498db;
color:white;
cursor:pointer;
margin-top:15px;

}

button:hover{
background:#2980b9;
}

</style>

</head>

<body>

<h1>ZAETHR Menu</h1>

<h2>Ürünler</h2>

<div id="products"></div>

<div class="cart">

<h2>Sepet</h2>

<ul id="cartList"></ul>

<h3>Toplam: €<span id="total">0</span></h3>

<button onclick="sendOrder()">Siparişi Gönder</button>

</div>

<script>

let cart=[];

function loadMenu(){

let menu=JSON.parse(localStorage.getItem("menu"))||[];

let container=document.getElementById("products");

container.innerHTML="";

menu.forEach(item=>{

let div=document.createElement("div");

div.className="product";

div.innerText=item.name+" - €"+item.price;

div.onclick=()=>{

cart.push(item);

renderCart();

};

container.appendChild(div);

});

}

function renderCart(){

let list=document.getElementById("cartList");

list.innerHTML="";

let total=0;

cart.forEach(i=>{

let li=document.createElement("li");

li.innerText=i.name+" €"+i.price;

list.appendChild(li);

total+=i.price;

});

document.getElementById("total").innerText=total;

}

function sendOrder(){

if(cart.length==0){
alert("Sepet boş");
return;
}

let orders=JSON.parse(localStorage.getItem("orders"))||[];

let total=cart.reduce((t,i)=>t+i.price,0);

orders.push({

id:Date.now(),
table:Math.floor(Math.random()*20)+1,
time:new Date().toLocaleTimeString(),
items:cart,
total:total

});

localStorage.setItem("orders",JSON.stringify(orders));

alert("Sipariş gönderildi");

cart=[];

renderCart();

}

loadMenu();

</script>

</body>
</html>
