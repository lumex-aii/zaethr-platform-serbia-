<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>ZAETHR Menu</title>

<style>

body{
background:#0b0b0b;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

h1{
font-size:40px;
margin-bottom:30px;
}

h2{
margin-top:40px;
}

#products button{

background:#1f1f1f;
color:white;
border:none;
padding:15px;
margin:10px;
border-radius:12px;
font-size:16px;
cursor:pointer;
transition:0.2s;

}

#products button:hover{
background:#333;
transform:scale(1.05);
}

#cart{

list-style:none;
padding:0;
margin-top:20px;

}

#cart li{

background:#1a1a1a;
margin:8px;
padding:10px;
border-radius:8px;

}

button.order{

background:#2ecc71;
color:white;
border:none;
padding:15px 25px;
font-size:18px;
border-radius:10px;
cursor:pointer;
margin-top:20px;

}

button.order:hover{
background:#27ae60;
}

.total{

font-size:22px;
margin-top:10px;

}

</style>

</head>

<body>

<h1>ZAETHR Restaurant Menu</h1>

<h2>Products</h2>

<div id="products"></div>

<h2>Cart</h2>

<ul id="cart"></ul>

<div class="total">
Total: €<span id="total">0</span>
</div>

<button class="order" onclick="sendOrder()">Siparişi Gönder</button>

<script>

let products = [
{name:"Burger",price:8},
{name:"Pizza",price:10},
{name:"Kola",price:3}
];

let cart = [];

function renderProducts(){

let container = document.getElementById("products");
container.innerHTML="";

products.forEach((p)=>{

let btn = document.createElement("button");

btn.innerText = p.name + " - €" + p.price;

btn.onclick = function(){

cart.push(p);
renderCart();

};

container.appendChild(btn);

});

}

function renderCart(){

let cartList = document.getElementById("cart");
cartList.innerHTML="";

let total = 0;

cart.forEach((p)=>{

let li = document.createElement("li");

li.innerText = p.name + " - €" + p.price;

cartList.appendChild(li);

total += p.price;

});

document.getElementById("total").innerText = total;

}

function sendOrder(){

if(cart.length==0){
alert("Sepet boş");
return;
}

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let total = cart.reduce((t,p)=>t+p.price,0);

let order = {

id: Date.now(),
table: Math.floor(Math.random()*20)+1,
time: new Date().toLocaleTimeString(),
items: cart,
total: total

};

orders.push(order);

localStorage.setItem("orders", JSON.stringify(orders));

alert("Sipariş gönderildi");

cart=[];
renderCart();

}

renderProducts();

</script>

</body>
</html>
