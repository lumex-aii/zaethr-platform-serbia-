<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>ZAETHR Menu</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

.product{
background:#1f1f1f;
padding:15px;
margin:10px;
border-radius:10px;
cursor:pointer;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
background:#3498db;
color:white;
margin-top:20px;
}

</style>

</head>

<body>

<h1>ZAETHR MENU</h1>

<div id="products"></div>

<h2>Sepet</h2>

<ul id="cart"></ul>

<h3>Toplam €<span id="total">0</span></h3>

<input id="table" type="number" placeholder="Masa No">

<button onclick="sendOrder()">Siparişi Gönder</button>

<script>

let cart=[]

function loadMenu(){

let menu=JSON.parse(localStorage.getItem("menu"))||[]

let area=document.getElementById("products")

area.innerHTML=""

menu.forEach(p=>{

let d=document.createElement("div")

d.className="product"

d.innerText=p.name+" - €"+p.price

d.onclick=()=>{

cart.push(p)

renderCart()

}

area.appendChild(d)

})

}

function renderCart(){

let ul=document.getElementById("cart")

ul.innerHTML=""

let total=0

cart.forEach(i=>{

let li=document.createElement("li")

li.innerText=i.name+" €"+i.price

ul.appendChild(li)

total+=i.price

})

document.getElementById("total").innerText=total

}

function sendOrder(){

let table=document.getElementById("table").value

if(!table||cart.length==0)return

let total=cart.reduce((t,i)=>t+i.price,0)

let orders=JSON.parse(localStorage.getItem("orders"))||[]

orders.push({

id:Date.now(),
table:table,
items:cart,
total:total,
time:new Date().toLocaleTimeString(),
status:"Bekliyor",
payment:"Bekleniyor",
courier:"Yok"

})

localStorage.setItem("orders",JSON.stringify(orders))

alert("Sipariş gönderildi")

cart=[]

renderCart()

}

loadMenu()

</script>

</body>
</html>
