<!DOCTYPE html>
<html lang="en">
<head>
<title>ZÆTHR Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 90px;
  overflow-x: hidden;
}

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: rgba(0,0,0,0.95);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
  z-index: 9999;
}

.logo {
  font-weight: bold;
  letter-spacing: 3px;
  font-size: 18px;
}

.menu {
  display: flex;
  gap: 18px;
}

.menu a {
  text-decoration: none;
  color: white;
  opacity: 0.7;
  font-size: 14px;
  transition: 0.2s;
}

.menu a:hover {
  opacity: 1;
}

/* LANGUAGE SWITCH */
.lang-switch {
  font-size: 13px;
  margin-left: 15px;
}

.lang-switch a {
  cursor: pointer;
  color: white;
  opacity: 0.5;
  margin: 0 3px;
  text-decoration: none;
}

.lang-switch a.active {
  opacity: 1;
  font-weight: bold;
}

/* HAMBURGER */
.hamburger {
  display: none;
  font-size: 26px;
  cursor: pointer;
}

/* MOBILE MENU */
@media (max-width: 768px) {
  .menu {
    display: none;
    position: absolute;
    top: 60px;
    right: 15px;
    background: black;
    padding: 15px;
    border: 1px solid #222;
    border-radius: 10px;
    flex-direction: column;
    gap: 10px;
  }

  .hamburger {
    display: block;
  }
}

/* HERO */
.hero {
  margin-top: 60px;
}

.hero-title {
  font-size: 3em;
  letter-spacing: 4px;
}

.hero-sub {
  font-size: 1.2em;
  opacity: 0.8;
  margin-top: 10px;
}

.hero-founder {
  font-size: 1em;
  opacity: 0.5;
  margin-top: 5px;
}

/* SECTIONS */
.section {
  max-width: 900px;
  margin: 60px auto;
  padding: 0 20px;
}

.section h2 {
  font-size: 2em;
  margin-bottom: 15px;
}

.section p {
  font-size: 1.05em;
  opacity: 0.75;
  line-height: 1.6;
}

/* FOOTER */
.footer {
  margin-top: 80px;
  font-size: 13px;
  opacity: 0.4;
  padding-bottom: 20px;
}

/* MOBILE MENU SHOW */
.menu.show {
  display: flex !important;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">ZÆTHR</div>

  <div class="hamburger" onclick="toggleMenu()">☰</div>

  <div class="menu" id="menuLinks">
    <a href="index.html" data-lang="nav_home">Home</a>
    <a href="about.html" data-lang="nav_about">About</a>
    <a href="vision.html" data-lang="nav_vision">Vision</a>
    <a href="serbia.html" data-lang="nav_serbia">Serbia</a>
    <a href="courier.html" data-lang="nav_courier">Courier</a>
    <a href="roadmap.html" data-lang="nav_roadmap">Roadmap</a>
    <a href="contact.html" data-lang="nav_contact">Contact</a>

    <!-- LANGUAGE BUTTONS -->
    <div class="lang-switch">
      <a onclick="setLang('en')" id="btn-en" class="lang-btn">EN</a> |
      <a onclick="setLang('tr')" id="btn-tr" class="lang-btn">TR</a> |
      <a onclick="setLang('sr')" id="btn-sr" class="lang-btn">SR</a>
    </div>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1 class="hero-title" data-lang="hero_title">ZÆTHR PLATFORM</h1>
  <p class="hero-sub" data-lang="hero_sub">Global Delivery & AI Business System</p>
  <p class="hero-founder" data-lang="hero_founder">Serbia Launch Phase — Founder: Murat EFE</p>
</div>

<!-- ABOUT PREVIEW -->
<div class="section">
  <h2 data-lang="about_title">About ZÆTHR</h2>
  <p data-lang="about_text"></p>
</div>

<!-- VISION PREVIEW -->
<div class="section">
  <h2 data-lang="vision_title">Our Vision</h2>
  <p data-lang="vision_text"></p>
</div>

<!-- ROADMAP PREVIEW -->
<div class="section">
  <h2 data-lang="roadmap_title">Roadmap</h2>
  <p data-lang="roadmap_text"></p>
</div>

<!-- FOOTER -->
<div class="footer">
  ZÆTHR Platform © 2026 — Founder: Murat EFE
</div>

<!-- MENU SCRIPT -->
<script>
function toggleMenu() {
  document.getElementById("menuLinks").classList.toggle("show");
}

document.querySelectorAll("#menuLinks a").forEach(link => {
  link.addEventListener("click", () => {
    document.getElementById("menuLinks").classList.remove("show");
  });
});
</script>

<!-- LANGUAGE SYSTEM -->
<script src="lang.js"></script>

</body>
</html>
