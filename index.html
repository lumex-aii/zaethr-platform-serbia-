<!DOCTYPE html>
<html lang="en">

<head>
  <!-- META -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ZAETHR Platform</title>

  <!-- STYLE -->
  <style>

    /* ===== GLOBAL ===== */
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 20vh;
      margin: 0;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: black;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      z-index: 999;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 18px;
    }

    .menu a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      opacity: 0.7;
      font-size: 14px;
    }

    .menu a:hover {
      opacity: 1;
    }

    /* ===== MOBILE MENU ===== */
    .hamburger {
      display: none;
      font-size: 26px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .menu {
        display: none;
        position: absolute;
        top: 60px;
        right: 15px;
        background: black;
        padding: 15px;
        border: 1px solid #222;
        border-radius: 10px;
        flex-direction: column;
      }

      .menu a {
        margin: 10px 0;
      }

      .hamburger {
        display: block;
      }
    }

  </style>
</head>

<body>

  <!-- ===== NAVBAR ===== -->
  <div class="navbar">
    <div class="logo">ZÆTHR</div>

    <div class="hamburger" onclick="toggleMenu()">☰</div>

    <div class="menu" id="menuLinks">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="serbia.html">Serbia</a>
      <a href="courier.html">Courier</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="contact.html">Join</a>
    </div>
  </div>


  <!-- ===== MAIN CONTENT ===== -->
  <h1>ZÆTHR PLATFORM</h1>

  <p>Global Delivery & AI Business System</p>

  <p>Serbia Launch Phase — Founder: Murat EFE</p>


  <!-- ===== SCRIPT ===== -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("menuLinks");

      if (menu.style.display === "flex") {
        menu.style.display = "none";
      } else {
        menu.style.display = "flex";
      }
    }
  </script>

</body>
</html>
