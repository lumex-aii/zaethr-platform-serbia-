<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zaethr Serbia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #0b0f19;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: white;
    }

    .lang-switch a {
      color: white;
      margin-left: 10px;
      cursor: pointer;
      opacity: 0.6;
      text-decoration: none;
    }

    .lang-switch a.active {
      opacity: 1;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 30px;
      font-size: 26px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      opacity: 0.85;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ZAETHR</div>

  <!-- LANGUAGE SWITCH -->
  <div class="lang-switch">
    <a onclick="setLang('en')" id="btn-en">EN</a>
    <a onclick="setLang('tr')" id="btn-tr">TR</a>
    <a onclick="setLang('sr')" id="btn-sr">SR</a>
  </div>
</header>

<div class="container">
  <h1 data-lang="serbia_title"></h1>

  <p data-lang="serbia_p1"></p>
  <p data-lang="serbia_p2"></p>

  <h2 data-lang="serbia_h2"></h2>
  <p data-lang="serbia_p3"></p>
  <p data-lang="serbia_p4"></p>
</div>

<script>
const translations = {
  en: {
    serbia_title: "Why Serbia?",
    serbia_p1: "Serbia is becoming one of Europe's fastest-growing startup hubs with strong tech talent and low operational costs.",
    serbia_p2: "Zaethr chooses Serbia as a strategic base for European expansion and AI innovation.",
    serbia_h2: "Business Advantages",
    serbia_p3: "Company formation is fast and affordable with friendly regulations for foreign founders.",
    serbia_p4: "Serbia offers access to EU markets, skilled workforce, and favorable tax policies for tech startups."
  },

  tr: {
    serbia_title: "Neden Sırbistan?",
    serbia_p1: "Sırbistan, güçlü teknoloji yetenekleri ve düşük operasyon maliyetleri ile Avrupa'nın en hızlı büyüyen startup merkezlerinden biri haline geliyor.",
    serbia_p2: "Zaethr, Avrupa genişlemesi ve yapay zekâ inovasyonu için Sırbistan’ı stratejik merkez olarak seçiyor.",
    serbia_h2: "İş Avantajları",
    serbia_p3: "Şirket kurmak hızlı ve uygun maliyetlidir, yabancı girişimciler için dostane düzenlemeler vardır.",
    serbia_p4: "Sırbistan, AB pazarlarına erişim, nitelikli iş gücü ve teknoloji girişimleri için avantajlı vergi politikaları sunar."
  },

  sr: {
    serbia_title: "Zašto Srbija?",
    serbia_p1: "Srbija postaje jedan od najbrže rastućih startup centara u Evropi sa jakim tehnološkim talentima i niskim troškovima poslovanja.",
    serbia_p2: "Zaethr bira Srbiju kao stratešku bazu za evropsku ekspanziju i AI inovacije.",
    serbia_h2: "Poslovne Prednosti",
    serbia_p3: "Osnivanje kompanije je brzo i povoljno, sa prijateljskim regulativama za strane osnivače.",
    serbia_p4: "Srbija nudi pristup tržištima EU, kvalifikovanu radnu snagu i povoljne poreske politike za tehnološke startape."
  }
};

function setLang(lang) {
  localStorage.setItem("siteLang", lang);
  applyLang(lang);
}

function applyLang(lang) {
  document.querySelectorAll("[data-lang]").forEach(el => {
    const key = el.getAttribute("data-lang");
    el.innerText = translations[lang][key];
  });

  document.querySelectorAll(".lang-switch a").forEach(a => a.classList.remove("active"));
  document.getElementById("btn-" + lang).classList.add("active");
}

const defaultLang = localStorage.getItem("siteLang") || "en";
applyLang(defaultLang);
</script>

</body>
</html>
