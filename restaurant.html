<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>ZAETHR Restaurant Panel</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
padding:30px;
}

h1{
font-size:42px;
margin-bottom:30px;
}

input{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

button{

padding:10px 18px;
border:none;
border-radius:10px;
background:#2ecc71;
color:white;
cursor:pointer;
margin:5px;

}

button:hover{
background:#27ae60;
}

.product{
display:inline-block;
background:#1e1e1e;
padding:10px 15px;
margin:5px;
border-radius:10px;
}

.order{

background:#1c1c1c;
padding:15px;
margin-top:15px;
border-radius:10px;

}

</style>

</head>

<body>

<h1>ZAETHR Restaurant Panel</h1>

<h2>Ürün Ekle</h2>

<input id="productName" placeholder="Ürün adı">
<input id="productPrice" placeholder="Fiyat">
<button onclick="addProduct()">Ürün Ekle</button>

<h2>Ürünler</h2>

<div id="menuList"></div>

<h2>Bugünkü Siparişler</h2>

<div id="orders"></div>

<h2>Günlük Ciro: €<span id="revenue">0</span></h2>

<button onclick="resetDay()">Gün Sonu Sıfırla</button>

<script>

function addProduct(){

let name=document.getElementById("productName").value;
let price=parseFloat(document.getElementById("productPrice").value);

if(!name || !price){
alert("Bilgi eksik");
return;
}

let menu=JSON.parse(localStorage.getItem("menu"))||[];

menu.push({name:name,price:price});

localStorage.setItem("menu",JSON.stringify(menu));

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";

renderMenu();

}

function renderMenu(){

let menu=JSON.parse(localStorage.getItem("menu"))||[];

let area=document.getElementById("menuList");

area.innerHTML="";

menu.forEach(item=>{

let div=document.createElement("div");

div.className="product";

div.innerText=item.name+" - €"+item.price;

area.appendChild(div);

});

}

function renderOrders(){

let orders=JSON.parse(localStorage.getItem("orders"))||[];

let container=document.getElementById("orders");

container.innerHTML="";

let totalRevenue=0;

orders.forEach(order=>{

totalRevenue+=order.total;

let itemsText=order.items.map(i=>i.name+" €"+i.price).join(", ");

let div=document.createElement("div");

div.className="order";

div.innerHTML=`

Saat: ${order.time} <br>
Masa: ${order.table} <br>
Ürünler: ${itemsText} <br>
Toplam: €${order.total}

`;

container.appendChild(div);

});

document.getElementById("revenue").innerText=totalRevenue;

}

function resetDay(){

localStorage.removeItem("orders");

renderOrders();

}

renderMenu();
renderOrders();

setInterval(renderOrders,2000);

</script>

</body>
</html>
