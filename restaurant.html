<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ZAETHR Restaurant Panel</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
padding:30px;
}

h1{
font-size:36px;
margin-bottom:30px;
}

input,select{
padding:10px;
border-radius:8px;
border:none;
margin:5px;
}

button{
padding:10px 14px;
border:none;
border-radius:8px;
background:#27ae60;
color:white;
cursor:pointer;
margin:3px;
}

button:hover{
background:#2ecc71;
}

.product{
background:#1e1e1e;
padding:10px;
border-radius:8px;
display:inline-block;
margin:5px;
}

.order{
background:#1c1c1c;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.details{
background:#141414;
padding:10px;
margin-top:10px;
border-radius:8px;
display:none;
}

</style>
</head>

<body>

<h1>ZAETHR Restaurant Panel</h1>

<h2>Ürün Ekle</h2>

<input id="pname" placeholder="Ürün adı">
<input id="pprice" type="number" placeholder="Fiyat">
<button onclick="addProduct()">Ürün Ekle</button>

<h2>Ürünler</h2>
<div id="menu"></div>

<h2>Manuel Sipariş Oluştur</h2>

<input id="table" type="number" placeholder="Masa No">

<select id="productSelect"></select>

<button onclick="addItemToOrder()">Ürün Ekle</button>

<ul id="tempCart"></ul>

<button onclick="createManualOrder()">Siparişi Gönder</button>

<h2>Bugünkü Siparişler</h2>

<div id="orders"></div>

<script>

let tempCart=[]

function addProduct(){

let name=document.getElementById("pname").value
let price=Number(document.getElementById("pprice").value)

if(!name || !price)return

let menu=JSON.parse(localStorage.getItem("menu"))||[]

menu.push({name,price})

localStorage.setItem("menu",JSON.stringify(menu))

document.getElementById("pname").value=""
document.getElementById("pprice").value=""

renderMenu()

}

function renderMenu(){

let menu=JSON.parse(localStorage.getItem("menu"))||[]

let area=document.getElementById("menu")
let select=document.getElementById("productSelect")

area.innerHTML=""
select.innerHTML=""

menu.forEach(p=>{

let d=document.createElement("div")
d.className="product"
d.innerText=p.name+" - €"+p.price
area.appendChild(d)

let op=document.createElement("option")
op.value=p.name
op.innerText=p.name+" €"+p.price
select.appendChild(op)

})

}

function addItemToOrder(){

let menu=JSON.parse(localStorage.getItem("menu"))||[]
let pname=document.getElementById("productSelect").value

let item=menu.find(x=>x.name==pname)

tempCart.push(item)

renderTempCart()

}

function renderTempCart(){

let ul=document.getElementById("tempCart")
ul.innerHTML=""

tempCart.forEach(i=>{
let li=document.createElement("li")
li.innerText=i.name+" €"+i.price
ul.appendChild(li)
})

}

function createManualOrder(){

let table=document.getElementById("table").value

if(!table || tempCart.length==0)return

let total=tempCart.reduce((t,i)=>t+i.price,0)

let orders=JSON.parse(localStorage.getItem("orders"))||[]

orders.push({

id:Date.now(),
table:table,
items:tempCart,
total:total,
time:new Date().toLocaleTimeString(),
status:"Bekliyor",
payment:"Bekleniyor",
courier:"Yok"

})

localStorage.setItem("orders",JSON.stringify(orders))

tempCart=[]
renderTempCart()
renderOrders()

}

function renderOrders(){

let orders=JSON.parse(localStorage.getItem("orders"))||[]

let container=document.getElementById("orders")

container.innerHTML=""

orders.forEach((o,i)=>{

let items=o.items.map(x=>x.name+" €"+x.price).join(", ")

let div=document.createElement("div")
div.className="order"

div.innerHTML=`

<b>Sipariş No:</b> ${o.id}<br>
<b>Masa:</b> ${o.table}<br>
<b>Toplam:</b> €${o.total}<br>

<button onclick="toggleDetails(${i})">Detaylar</button>
<button onclick="approve(${i})">Onayla</button>
<button onclick="cancel(${i})">İptal</button>
<button onclick="pay(${i})">Ödeme Al</button>
<button onclick="assignCourier(${i})">Kurye Ata</button>

<div class="details" id="d${i}">

Ürünler: ${items}<br>
Saat: ${o.time}<br>
Durum: ${o.status}<br>
Ödeme: ${o.payment}<br>
Kurye: ${o.courier}<br>

</div>

`

container.appendChild(div)

})

}

function toggleDetails(i){

let el=document.getElementById("d"+i)

if(el.style.display=="none"||el.style.display==""){
el.style.display="block"
}else{
el.style.display="none"
}

}

function approve(i){

let orders=JSON.parse(localStorage.getItem("orders"))
orders[i].status="Hazırlanıyor"
localStorage.setItem("orders",JSON.stringify(orders))
renderOrders()

}

function cancel(i){

let orders=JSON.parse(localStorage.getItem("orders"))
orders.splice(i,1)
localStorage.setItem("orders",JSON.stringify(orders))
renderOrders()

}

function pay(i){

let orders=JSON.parse(localStorage.getItem("orders"))
orders[i].payment="Ödendi"
localStorage.setItem("orders",JSON.stringify(orders))
renderOrders()

}

function assignCourier(i){

let name=prompt("Kurye adı")

let orders=JSON.parse(localStorage.getItem("orders"))

orders[i].courier=name

localStorage.setItem("orders",JSON.stringify(orders))

renderOrders()

}

renderMenu()
renderOrders()

setInterval(renderOrders,2000)

</script>

</body>
</html>
