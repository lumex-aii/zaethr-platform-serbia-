<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAETHR Restaurant Panel</title>
<style>
body {
    background-color: #000;
    color: #fff;
}
</style>
<link rel="stylesheet" href="stil.css">
</head>

<body>

<h1 style="text-align:center;">ZAETHR Restaurant Panel</h1>
    <h3>Ürün Ekle</h3>

<input id="productName" placeholder="Ürün adı">
<input id="productPrice" placeholder="Fiyat">

<button onclick="addProduct()">Ürün Ekle</button>

<div id="productList"></div>

<div class="container">

    <div class="products">
        <h2>Ürünler</h2>
        <button onclick="addItem('Burger', 8)">Burger - €8</button>
        <button onclick="addItem('Pizza', 10)">Pizza - €10</button>
        <button onclick="addItem('Kola', 3)">Kola - €3</button>
    </div>

    <div class="cart">
        <h2>Sepet</h2>
        <h2>Bugünkü Siparişler</h2>
        <ul id="order-history"></ul>
        <ul id="cart-list"></ul>
        <h3>Toplam: €<span id="total">0</span></h3>
        <h3>Günlük Ciro: €<span id="dailyRevenue"></span></h3>
        <button onclick="resetDay()">Gün Sonu Sıfırla</button>
        <button onclick="saveOrder()">Siparişi Kaydet</button>
    </div>

</div>

<script>
let orderHistory = document.getElementById("order-history");
function addOrderToList(order,index){

let li = document.createElement("li");

li.innerHTML = `
<b>${order.time}</b> - €${order.total}

<button onclick="approveOrder(${index})">Siparişi Onayla</button>
<button onclick="showDetails(${index})">Detaylar</button>

<div id="details-${index}" style="display:none;margin-top:5px;">
Sipariş No: ${order.id || "-"}<br>
Masa No: ${order.table || "-"}<br>
Ürünler: ${order.items ? order.items.map(i => i.name + " €" + i.price).join(", ") : "-"}
</div>

<hr>
`;

orderHistory.appendChild(li);

}


// Daha önceki siparişleri yükle
let savedOrders = JSON.parse(localStorage.getItem("orders")) || [];
savedOrders.forEach((order,index) => {
addOrderToList(order,index);
});
let total = 0;
let cart = [];

let cartList = document.getElementById("cart-list");
let totalDisplay = document.getElementById("total");
let dailyRevenueDisplay = document.getElementById("dailyRevenue");

// Günlük ciroyu başlat
let dailyRevenue = localStorage.getItem("dailyRevenue");
if (!dailyRevenue) {
    dailyRevenue = 0;
    localStorage.setItem("dailyRevenue", 0);
}

updateDailyRevenue();

// Ürün ekleme
function addItem(name, price) {
    cart.push({name, price});
    
    let li = document.createElement("li");
    li.textContent = name + " - €" + price;
    cartList.appendChild(li);

    total += price;
    totalDisplay.textContent = total;
}

// Siparişi kaydet
function saveOrder() {
    if (cart.length === 0) {
        alert("Sepet boş!");
        return;
    }

    let revenue = parseFloat(localStorage.getItem("dailyRevenue"));
    revenue += total;
    localStorage.setItem("dailyRevenue", revenue);

    updateDailyRevenue();

    let order = {
        time: new Date().toLocaleTimeString(),
        total: total
    };

    savedOrders.push(order);
    localStorage.setItem("orders", JSON.stringify(savedOrders));

    addOrderToList(order);

    alert("Sipariş kaydedildi!");

    cart = [];
    cartList.innerHTML = "";
    total = 0;
    totalDisplay.textContent = total;
}

// Günlük ciroyu göster
function updateDailyRevenue() {
    dailyRevenueDisplay.textContent = localStorage.getItem("dailyRevenue");
}

// Gün sonu sıfırlama
function resetDay() {
    localStorage.setItem("dailyRevenue", 0);
    updateDailyRevenue();
    alert("Günlük ciro sıfırlandı.");
}
    let products = JSON.parse(localStorage.getItem("products")) || [];

function addProduct(){

let name = document.getElementById("productName").value
let price = document.getElementById("productPrice").value

products.push({name,price})

localStorage.setItem("products", JSON.stringify(products))

renderProducts()

}

function renderProducts(){

let list = document.getElementById("productList")
list.innerHTML=""

products.forEach((p,index)=>{

list.innerHTML += `
<div>
${p.name} - ${p.price}€
<button onclick="deleteProduct(${index})">Sil</button>
</div>
`

})

}

function deleteProduct(index){

products.splice(index,1)

localStorage.setItem("products", JSON.stringify(products))

renderProducts()

}

renderProducts()

function approveOrder(index){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.splice(index,1);

localStorage.setItem("orders", JSON.stringify(orders));

location.reload();

}

function showDetails(index){

let div = document.getElementById("details-"+index);

if(div.style.display === "none"){
div.style.display = "block";
}else{
div.style.display = "none";
}

}
</script>

</body>
</html>
