<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAETHR Restaurant Panel</title>
<style>
body {
    background-color: #000;
    color: #fff;
}
</style>
<link rel="stylesheet" href="stil.css">
</head>

<body>

<h1 style="text-align:center;">ZAETHR Restaurant Panel</h1>
    <h3>Ürün Ekle</h3>

<input id="productName" placeholder="Ürün adı">
<input id="productPrice" placeholder="Fiyat">

<button onclick="addProduct()">Ürün Ekle</button>

<div id="productList"></div>

<div class="container">

    <div class="products">
        <h2>Ürünler</h2>
        <button onclick="addItem('Burger', 8)">Burger - €8</button>
        <button onclick="addItem('Pizza', 10)">Pizza - €10</button>
        <button onclick="addItem('Kola', 3)">Kola - €3</button>
    </div>

    <div class="cart">
        <h2>Sepet</h2>
        <h2>Bugünkü Siparişler</h2>
        <ul id="order-history"></ul>
        <ul id="cart-list"></ul>
        <h3>Toplam: €<span id="total">0</span></h3>
        <h3>Günlük Ciro: €<span id="dailyRevenue"></span></h3>
        <button onclick="resetDay()">Gün Sonu Sıfırla</button>
        <button onclick="saveOrder()">Siparişi Kaydet</button>
    </div>

</div>

<script>

function addProduct(){

let name = document.getElementById("product-name").value;
let price = parseFloat(document.getElementById("product-price").value);

if(!name || !price){
alert("Ürün bilgisi eksik");
return;
}

let menu = JSON.parse(localStorage.getItem("menu")) || [];

menu.push({
name:name,
price:price
});

localStorage.setItem("menu",JSON.stringify(menu));

document.getElementById("product-name").value="";
document.getElementById("product-price").value="";

renderMenu();

}

function renderMenu(){

let menu = JSON.parse(localStorage.getItem("menu")) || [];

let container = document.getElementById("menu-items");

container.innerHTML="";

menu.forEach((item)=>{

let btn = document.createElement("button");

btn.innerText = item.name + " - €" + item.price;

container.appendChild(btn);

});

}

function renderOrders(){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let container = document.getElementById("order-list");

container.innerHTML="";

let revenue = 0;

orders.forEach((order,index)=>{

revenue += order.total;

let li = document.createElement("li");

let itemsText = order.items.map(i=> i.name + " €" + i.price).join(", ");

li.innerHTML = `

${order.time} - €${order.total}

<button onclick="approveOrder(${index})">Siparişi Onayla</button>

<button onclick="toggleDetails(${index})">Detaylar</button>

<div id="details-${index}" style="display:none;margin-top:10px">

Sipariş No: ${order.id} <br>
Masa No: ${order.table} <br>
Ürünler: ${itemsText}

</div>

<hr>

`;

container.appendChild(li);

});

document.getElementById("daily-revenue").innerText = "€"+revenue;

}

function toggleDetails(i){

let el = document.getElementById("details-"+i);

if(el.style.display=="none"){
el.style.display="block";
}else{
el.style.display="none";
}

}

function approveOrder(i){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.splice(i,1);

localStorage.setItem("orders",JSON.stringify(orders));

renderOrders();

}

renderMenu();
renderOrders();

</script>

</body>
</html>
