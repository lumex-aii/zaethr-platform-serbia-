<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision AI Startup - Roadmap</title>
<link rel="stylesheet" href="style.css">

<script>
const translations = {
  en: {
    title: "Roadmap",
    r1_title: "Phase 1 - Foundation",
    r1_desc: "Company registration, legal setup, branding, and MVP AI courier platform launch.",
    r2_title: "Phase 2 - Market Entry",
    r2_desc: "Courier recruitment, AI dispatch system beta, partnerships with local businesses.",
    r3_title: "Phase 3 - Scaling",
    r3_desc: "Expansion to Serbia and EU, automation, investor funding round.",
    r4_title: "Phase 4 - AI Ecosystem",
    r4_desc: "Full AI logistics ecosystem, autonomous delivery research, global expansion.",
    footer: "© 2026 Vision AI Startup. All rights reserved."
  },
  tr: {
    title: "Yol Haritası",
    r1_title: "Aşama 1 - Temel Kurulum",
    r1_desc: "Şirket kurulumu, yasal süreçler, marka kimliği ve AI kurye platformu MVP lansmanı.",
    r2_title: "Aşama 2 - Pazara Giriş",
    r2_desc: "Kurye işe alımı, AI dağıtım sistemi beta, yerel işletmelerle iş ortaklıkları.",
    r3_title: "Aşama 3 - Büyüme",
    r3_desc: "Sırbistan ve AB genişleme, otomasyon, yatırımcı fon turu.",
    r4_title: "Aşama 4 - AI Ekosistemi",
    r4_desc: "Tam AI lojistik ekosistemi, otonom teslimat araştırması, global genişleme.",
    footer: "© 2026 Vision AI Startup. Tüm hakları saklıdır."
  },
  sr: {
    title: "Plan razvoja",
    r1_title: "Faza 1 - Osnova",
    r1_desc: "Registracija kompanije, pravni procesi, brendiranje i lansiranje AI kurirske platforme.",
    r2_title: "Faza 2 - Ulazak na tržište",
    r2_desc: "Regrutovanje kurira, beta AI sistem raspodele, partnerstva sa lokalnim firmama.",
    r3_title: "Faza 3 - Širenje",
    r3_desc: "Širenje na Srbiju i EU, automatizacija, investicioni krug.",
    r4_title: "Faza 4 - AI Ekosistem",
    r4_desc: "Pun AI logistički ekosistem, istraživanje autonomne dostave, globalno širenje.",
    footer: "© 2026 Vision AI Startup. Sva prava zadržana."
  }
};

function setLanguage(lang) {
  localStorage.setItem("lang", lang);
  applyLanguage();
}

function applyLanguage() {
  const lang = localStorage.getItem("lang") || "en";
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.getAttribute("data-key");
    el.textContent = translations[lang][key];
  });
}

document.addEventListener("DOMContentLoaded", applyLanguage);
</script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0a0f2c;
  color: white;
  margin: 0;
  padding: 0;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: #0d1440;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #00b3ff;
}

.lang-buttons button {
  margin-left: 8px;
  padding: 6px 12px;
  border: none;
  background: #00b3ff;
  color: black;
  cursor: pointer;
  border-radius: 5px;
  font-weight: bold;
}

.lang-buttons button:hover {
  background: white;
}

section {
  padding: 60px 40px;
  max-width: 900px;
  margin: auto;
}

.roadmap-item {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  margin-bottom: 20px;
  border-left: 4px solid #00b3ff;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 20px;
  background: #0d1440;
  font-size: 14px;
  margin-top: 40px;
}
</style>

</head>

<body>

<header>
  <div class="logo">Vision AI Startup</div>
  <div class="lang-buttons">
    <button onclick="setLanguage('en')">EN</button>
    <button onclick="setLanguage('tr')">TR</button>
    <button onclick="setLanguage('sr')">SR</button>
  </div>
</header>

<section>
  <h1 data-key="title">Roadmap</h1>

  <div class="roadmap-item">
    <h3 data-key="r1_title">Phase 1 - Foundation</h3>
    <p data-key="r1_desc"></p>
  </div>

  <div class="roadmap-item">
    <h3 data-key="r2_title">Phase 2 - Market Entry</h3>
    <p data-key="r2_desc"></p>
  </div>

  <div class="roadmap-item">
    <h3 data-key="r3_title">Phase 3 - Scaling</h3>
    <p data-key="r3_desc"></p>
  </div>

  <div class="roadmap-item">
    <h3 data-key="r4_title">Phase 4 - AI Ecosystem</h3>
    <p data-key="r4_desc"></p>
  </div>

</section>

<footer>
  <p data-key="footer"></p>
</footer>

</body>
</html>
