<!DOCTYPE html>
<html lang="en">
<head>
<title>Contact — ZÆTHR Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 90px;
}

/* NAVBAR */
.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: black;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
  z-index: 9999;
}

.logo {
  font-weight: bold;
  letter-spacing: 3px;
  font-size: 18px;
}

.menu {
  display: flex;
  gap: 20px;
}

.menu a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  opacity: 0.7;
}

.menu a:hover {
  opacity: 1;
}

/* LANGUAGE SWITCH */
.lang-switch a {
  color: white;
  text-decoration: none;
  font-size: 13px;
  opacity: 0.6;
  margin: 0 5px;
  cursor: pointer;
}

.lang-switch a:hover {
  opacity: 1;
}

/* HAMBURGER */
.hamburger {
  display: none;
  font-size: 26px;
  cursor: pointer;
}

@media (max-width: 768px) {
  .menu {
    display: none;
    position: absolute;
    top: 55px;
    right: 15px;
    background: black;
    padding: 15px;
    border: 1px solid #222;
    border-radius: 10px;
    flex-direction: column;
    gap: 10px;
  }
  .menu.show {
    display: flex;
  }
  .hamburger {
    display: block;
  }
  .lang-switch {
    display: none;
  }
}

/* CONTENT */
.container {
  max-width: 700px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 2.7em;
  letter-spacing: 3px;
}

p {
  font-size: 1.1em;
  opacity: 0.85;
  margin-top: 15px;
  line-height: 1.6;
}

/* CONTACT BOX */
.contact-box {
  margin-top: 30px;
  padding: 20px;
  border: 1px solid #222;
  border-radius: 10px;
  background: #0a0a0a;
}

.email-link {
  color: #00c8ff;
  text-decoration: none;
  font-size: 1.1em;
}

.email-link:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">ZÆTHR</div>

  <div class="lang-switch">
    <a onclick="setLang('en')">EN</a> |
    <a onclick="setLang('tr')">TR</a> |
    <a onclick="setLang('sr')">SR</a>
  </div>

  <div class="hamburger" onclick="toggleMenu()">☰</div>

  <div class="menu" id="menuLinks">
    <a href="index.html" data-key="home">Home</a>
    <a href="about.html" data-key="about">About</a>
    <a href="serbia.html" data-key="serbia">Serbia</a>
    <a href="courier.html" data-key="courier">Courier</a>
    <a href="roadmap.html" data-key="roadmap">Roadmap</a>
    <a href="contact.html" data-key="join">Join</a>
  </div>
</div>

<!-- CONTENT -->
<div class="container">
  <h1 data-key="contact_title">CONTACT ZÆTHR</h1>

  <p data-key="contact_p1">
    Reach out for partnerships, investment opportunities, technology collaboration, or early courier program participation.
  </p>

  <div class="contact-box">
    <p data-key="contact_email">Official Contact Email:</p>
    <a class="email-link" href="mailto:zaethr.io@gmail.com">zaethr.io@gmail.com</a>
  </div>
</div>

<script>
// HAMBURGER
function toggleMenu() {
  document.getElementById("menuLinks").classList.toggle("show");
}

// TRANSLATIONS
const translations = {
  en: {
    home: "Home",
    about: "About",
    serbia: "Serbia",
    courier: "Courier",
    roadmap: "Roadmap",
    join: "Join",
    contact_title: "CONTACT ZÆTHR",
    contact_p1: "Reach out for partnerships, investment opportunities, technology collaboration, or early courier program participation.",
    contact_email: "Official Contact Email:"
  },
  tr: {
    home: "Ana Sayfa",
    about: "Hakkımızda",
    serbia: "Sırbistan",
    courier: "Kurye Sistemi",
    roadmap: "Yol Haritası",
    join: "Katıl",
    contact_title: "ZÆTHR İLETİŞİM",
    contact_p1: "Ortaklık, yatırım fırsatları, teknoloji iş birlikleri veya erken kurye programına katılım için bizimle iletişime geçin.",
    contact_email: "Resmi İletişim E-Postası:"
  },
  sr: {
    home: "Početna",
    about: "O Nama",
    serbia: "Srbija",
    courier: "Kurir Sistem",
    roadmap: "Plan",
    join: "Pridruži se",
    contact_title: "KONTAKT ZÆTHR",
    contact_p1: "Kontaktirajte nas za partnerstva, investicije, tehnološku saradnju ili rani kurirski program.",
    contact_email: "Zvanični Email Kontakt:"
  }
};

// LANGUAGE SWITCH
function setLang(lang) {
  localStorage.setItem("lang", lang);
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.getAttribute("data-key");
    el.innerHTML = translations[lang][key];
  });
}

// AUTO LOAD
const savedLang = localStorage.getItem("lang") || "en";
setLang(savedLang);
</script>

</body>
</html>
